server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - client-side routing has nothing to match server-side.
    location / {
        try_files $uri /index.html;
    }

    # The export endpoint streams rows straight from Postgres to the response
    # (pg-query-stream, see apps/api/src/routes/export.ts) so it never
    # materializes the full result set in memory. Must come before the
    # generic /v1/ block below: with default buffering nginx would still
    # accumulate the whole response to disk before sending the first byte,
    # defeating that design and delaying the download start.
    location /v1/logs/export {
        proxy_pass http://api:4000/v1/logs/export;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Same-origin API: the SPA calls fetch('/v1/...') with VITE_API_BASE_URL
    # baked in as "" at build time (see apps/web/Dockerfile).
    location /v1/ {
        proxy_pass http://api:4000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://api:4000/health;
    }

    # WebSocket upgrade for the live log stream.
    location /ws {
        proxy_pass http://api:4000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
