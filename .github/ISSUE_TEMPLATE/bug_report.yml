name: Reporte de bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Qué pasó
      description: Descripción clara y concisa del problema.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: Cómo lo levantaste
      options:
        - docker compose up
        - Desarrollo local (npm run dev:api / dev:web)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión / commit
      placeholder: 'ej. main @ 67936d6, o la versión del release'
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Salida de consola, logs de `docker compose logs api`, errores del navegador, etc.
      render: shell
    validations:
      required: false
