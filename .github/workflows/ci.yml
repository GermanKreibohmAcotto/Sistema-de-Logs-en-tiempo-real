name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: logs
          POSTGRES_PASSWORD: logs
          POSTGRES_DB: logs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logs -d logs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Builds every workspace and typechecks apps/api's test files (the one
      # tsconfig the build scripts don't already cover) - see package.json.
      - run: npm run typecheck
      # vitest.setup.ts defaults DATABASE_URL/REDIS_URL to match the
      # `services:` above, so the integration suite runs for real here
      # instead of skipping like it does without local Postgres/Redis.
      - run: npm test
